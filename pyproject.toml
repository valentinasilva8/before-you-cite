[project]
name = "before-you-cite"
version = "0.1.0"
description = "Retraction audit over a frozen Retraction Watch extract and one live Crossref check per DOI or title."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "litellm>=1.50",
    "google-cloud-aiplatform>=1.40.0",
    "httpx>=0.27",
    "pytest>=8.0",
    "mcp>=2.2.0,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
